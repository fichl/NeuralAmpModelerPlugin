<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="720" height="420" rx="26" fill="#141416"/>
  <rect x="0" y="0" width="720" height="420" rx="26" fill="#222225" opacity="0.65"/>

  <rect x="105" y="74" width="510" height="272" rx="12" fill="#f5f5f5" filter="url(#shadow)"/>
  <rect x="105.5" y="74.5" width="509" height="271" rx="11.5" fill="none" stroke="#c7c7c7"/>

  <text x="130" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#161616">Update available</text>
  <line x1="105" y1="135" x2="615" y2="135" stroke="#dedede"/>

  <line x1="579" y1="100" x2="593" y2="114" stroke="#3a3a3a" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="593" y1="100" x2="579" y2="114" stroke="#3a3a3a" stroke-width="2.2" stroke-linecap="round"/>

  <text x="130" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#202020">
    <tspan x="130" dy="0">A newer stable release of NAM On Steroids is available.</tspan>
    <tspan x="130" dy="34">Current version: 2.1.0</tspan>
    <tspan x="130" dy="24">Latest stable release: 2.1.1</tspan>
    <tspan x="130" dy="34">Open the GitHub release page?</tspan>
  </text>

  <rect x="420" y="292" width="76" height="34" rx="4" fill="#fbfbfb" stroke="#999999"/>
  <text x="458" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#202020">No</text>

  <rect x="511" y="292" width="76" height="34" rx="4" fill="#fbfbfb" stroke="#0078d7" stroke-width="1.4"/>
  <text x="549" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#202020">Yes</text>

  <text x="360" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#a5a5a5">
    Mock indicativo: il look finale dipende dal sistema operativo/host, il testo è quello del plugin.
  </text>
</svg>
